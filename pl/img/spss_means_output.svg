  <rect x="204" y="278" width="62" height="26" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="215" y="295" fill="#333" font-size="11">Cancel</text>
  <rect x="274" y="278" width="50" height="26" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="287" y="295" fill="#333" font-size="11">Help</text>
  <rect x="366" y="278" width="76" height="26" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="378" y="295" fill="#333" font-size="11">Options...</text>

  <!-- RIGHT: Output Viewer -->
  <rect x="536" y="36" width="492" height="298"
        fill="#F0F0F0" stroke="#888" stroke-width="1" filter="url(#ds)"/>

  <rect x="536"  y="36"  width="492" height="26" fill="url(#tb)"/>
  <rect x="968"  y="39"  width="16"  height="16" fill="#6B6B6B" rx="1"/>
  <line x1="971" y1="47" x2="981"   y2="47" stroke="white" stroke-width="1.5"/>
  <rect x="986"  y="39"  width="16"  height="16" fill="#6B6B6B" rx="1"/>
  <polyline points="989,42 999,42 999,52 989,52 989,42" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="1004" y="39"  width="16"  height="16" fill="#C42B1C" rx="1"/>
  <line x1="1007" y1="42" x2="1017" y2="52" stroke="white" stroke-width="1.5"/>
  <line x1="1017" y1="42" x2="1007" y2="52" stroke="white" stroke-width="1.5"/>
  <text x="544" y="53" fill="white" font-size="10.5" font-weight="bold">*Output1 [Document1] – IBM SPSS Statistics Viewer</text>

  <rect x="536" y="62" width="492" height="272" fill="white"/>
  <text x="553" y="80" fill="#555" font-size="10" font-style="italic">Means</text>

  <!-- Raport table
       col1: x=553-663 (w=110)  col2: x=663-760 (w=97)
       col3: x=760-832 (w=72)   col4: x=832-982 (w=150)  -->
  <text x="767" y="98" text-anchor="middle" font-weight="bold" font-size="12">Raport</text>

  <rect x="553" y="103" width="429" height="136" fill="none" stroke="#AEAAAA" stroke-width="1"/>

  <!-- Subheader -->
  <rect x="553" y="103" width="110" height="20" fill="#F2F2F2"/>
  <rect x="663" y="103" width="319" height="20" fill="#F2F2F2"/>
  <text x="822" y="117" text-anchor="middle" font-size="9.5" font-style="italic">Wynik czytania (średnia z 5 PV)</text>
  <line x1="553" y1="123" x2="982" y2="123" stroke="#AEAAAA" stroke-width="1"/>

  <!-- Col headers -->
  <rect x="553" y="123" width="429" height="38" fill="#F2F2F2"/>
  <text x="608" y="146" text-anchor="middle" font-weight="bold" font-size="10">Sex of Students</text>
  <text x="711" y="146" text-anchor="middle" font-weight="bold" font-size="10">Średnia</text>
  <text x="796" y="146" text-anchor="middle" font-weight="bold" font-size="10">N</text>
  <text x="907" y="137" text-anchor="middle" font-weight="bold" font-size="10">Błąd standardowy</text>
  <text x="907" y="149" text-anchor="middle" font-weight="bold" font-size="10">średniej</text>
  <line x1="553" y1="161" x2="982" y2="161" stroke="#AEAAAA" stroke-width="1"/>

  <!-- Girl -->
  <rect x="553" y="161" width="110" height="24" fill="#4472C4"/>
  <text x="608" y="177" text-anchor="middle" fill="white" font-weight="bold" font-size="10.5">Girl</text>
  <text x="756" y="177" text-anchor="end" font-size="10.5">559,7494</text>
  <text x="828" y="177" text-anchor="end" font-size="10.5">155 977</text>
  <text x="978" y="177" text-anchor="end" font-size="10.5">,16594</text>
  <line x1="553" y1="185" x2="982" y2="185" stroke="#AEAAAA" stroke-width="0.5"/>

  <!-- Boy -->
  <rect x="553" y="185" width="110" height="24" fill="#4472C4"/>
  <text x="608" y="201" text-anchor="middle" fill="white" font-weight="bold" font-size="10.5">Boy</text>
  <text x="756" y="201" text-anchor="end" font-size="10.5">539,6900</text>
  <text x="828" y="201" text-anchor="end" font-size="10.5">175 785</text>
  <text x="978" y="201" text-anchor="end" font-size="10.5">,16280</text>
  <line x1="553" y1="209" x2="982" y2="209" stroke="#AEAAAA" stroke-width="0.5"/>

  <!-- Ogółem -->
  <rect x="553" y="209" width="110" height="24" fill="#4472C4"/>
  <text x="608" y="225" text-anchor="middle" fill="white" font-weight="bold" font-size="10.5">Ogółem</text>
  <text x="756" y="225" text-anchor="end" font-size="10.5">549,1209</text>
  <text x="828" y="225" text-anchor="end" font-size="10.5">331 763</text>
  <text x="978" y="225" text-anchor="end" font-size="10.5">,11760</text>

  <line x1="553" y1="239" x2="982" y2="239" stroke="#AEAAAA" stroke-width="1"/>

  <!-- Vertical dividers -->
  <line x1="663" y1="103" x2="663" y2="239" stroke="#AEAAAA" stroke-width="1"/>
  <line x1="760" y1="123" x2="760" y2="239" stroke="#AEAAAA" stroke-width="1"/>
  <line x1="832" y1="123" x2="832" y2="239" stroke="#AEAAAA" stroke-width="1"/>

</svg>
