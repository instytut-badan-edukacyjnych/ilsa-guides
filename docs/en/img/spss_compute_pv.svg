<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Segoe UI', Arial, sans-serif" font-size="11">

  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E82CF"/>
      <stop offset="100%" stop-color="#1A60A8"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="620" height="420" fill="#F0F0F0"/>

  <!-- Step badge (top-left, matching other SVGs) -->
  <rect x="14" y="8" width="84" height="22" fill="#1D5B96" rx="3"/>
  <text x="21" y="23" fill="white" font-size="12" font-weight="bold">Step 1</text>
  <text x="104" y="23" fill="#1A1A1A" font-size="11">Transform → Compute Variable...</text>

  <!-- Dialog shadow + frame -->
  <rect x="17" y="39" width="590" height="373" fill="#00000022" rx="1"/>
  <rect x="14" y="36" width="590" height="373" fill="#F0F0F0" stroke="#999" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="14" y="36" width="590" height="26" fill="url(#tb)"/>
  <rect x="582" y="39" width="18" height="18" fill="#C42B1C" rx="1"/>
  <line x1="585" y1="42" x2="597" y2="54" stroke="white" stroke-width="1.5"/>
  <line x1="597" y1="42" x2="585" y2="54" stroke="white" stroke-width="1.5"/>
  <text x="24" y="53" fill="white" font-size="12" font-weight="bold">Compute Variable</text>

  <!-- White content area -->
  <rect x="20" y="68" width="578" height="300" fill="white" stroke="#D8D8D8" stroke-width="1"/>

  <!-- ═══ TARGET VARIABLE + EXPRESSION ═══ -->
  <text x="28" y="84" fill="#333" font-size="11">Target Variable:</text>
  <rect x="28" y="88" width="142" height="22" fill="white" stroke="#0078D7" stroke-width="2" rx="1"/>
  <text x="34" y="103" fill="#00008B" font-size="11" font-weight="bold"
        font-family="'Courier New', Courier, monospace">READ_MEAN</text>

  <text x="178" y="102" fill="#333" font-size="15">=</text>

  <text x="194" y="84" fill="#333" font-size="11">Numeric Expression:</text>
  <rect x="194" y="88" width="400" height="40" fill="white" stroke="#0078D7" stroke-width="2" rx="1"/>
  <text x="200" y="102" fill="#00008B" font-size="11"
        font-family="'Courier New', Courier, monospace">MEAN(ASRREA01, ASRREA02, ASRREA03, ASRREA04, ASRREA05)</text>

  <!-- Type & Label button -->
  <rect x="28" y="116" width="96" height="22" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="38" y="131" fill="#333" font-size="11">Type &amp; Label...</text>

  <!-- Separator -->
  <line x1="20" y1="143" x2="598" y2="143" stroke="#E0E0E0" stroke-width="1"/>

  <!-- ═══ LEFT PANEL: Variable list ═══ -->
  <rect x="28" y="147" width="155" height="185" fill="white" stroke="#888" stroke-width="1"/>
  <rect x="171" y="148" width="11" height="183" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="1"/>
  <rect x="172" y="166" width="9"  height="44"  fill="#AAAAAA" rx="3"/>

  <!-- IDCNTRY (highlighted yellow) -->
  <rect x="29" y="148" width="141" height="17" fill="#FFFACD"/>
  <circle cx="38" cy="156.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="156.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="160"    fill="#111" font-size="11">IDCNTRY</text>
  <!-- IDSCHOOL -->
  <circle cx="38" cy="173.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="173.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="177"    fill="#111" font-size="11">IDSCHOOL</text>
  <!-- IDPOP -->
  <circle cx="38" cy="190.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="190.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="194"    fill="#111" font-size="11">IDPOP</text>
  <!-- IDGRADER -->
  <circle cx="38" cy="207.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="207.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="211"    fill="#111" font-size="11">IDGRADER</text>
  <!-- IDGRADE -->
  <circle cx="38" cy="224.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="224.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="228"    fill="#111" font-size="11">IDGRADE</text>
  <!-- WAVE -->
  <circle cx="38" cy="241.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="241.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="245"    fill="#111" font-size="11">WAVE</text>
  <!-- IDCLASS -->
  <circle cx="38" cy="258.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="258.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="262"    fill="#111" font-size="11">IDCLASS</text>
  <!-- IDSTUD -->
  <circle cx="38" cy="275.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="275.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="279"    fill="#111" font-size="11">IDSTUD</text>
  <!-- ITSEX -->
  <circle cx="38" cy="292.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="292.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="296"    fill="#111" font-size="11">ITSEX</text>
  <!-- ITADMINI -->
  <circle cx="38" cy="309.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="309.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="313"    fill="#111" font-size="11">ITADMINI</text>
  <!-- LCID_SA -->
  <circle cx="38" cy="326.5" r="4" fill="#E74C3C"/>
  <circle cx="46" cy="326.5" r="4" fill="#27AE60"/>
  <text  x="54"  y="330"    fill="#111" font-size="11">LCID_SA</text>

  <!-- Arrow button → (moves variable to expression) -->
  <rect x="188" y="212" width="30" height="26"
        fill="#E0E0E0" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <polygon points="194,222  194,228  207,228  207,231  215,225  207,219  207,222"
           fill="#444"/>

  <!-- ═══ CENTER: Function group ═══ -->
  <text x="226" y="156" fill="#333" font-size="11">Function group:</text>
  <rect x="226" y="160" width="158" height="100"
        fill="white" stroke="#888" stroke-width="1"/>
  <rect x="372" y="161" width="11" height="98" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="1"/>
  <!-- All (gray highlight) -->
  <rect x="227" y="161" width="144" height="16" fill="#C8C8C8"/>
  <text x="232" y="173" fill="#111" font-size="11" font-weight="bold">All</text>
  <text x="232" y="187" fill="#333" font-size="10">Arithmetic</text>
  <text x="232" y="200" fill="#333" font-size="10">CDF &amp; Noncentral CDF</text>
  <text x="232" y="213" fill="#333" font-size="10">Conversion</text>
  <text x="232" y="226" fill="#333" font-size="10">Current Date/Time</text>
  <text x="232" y="239" fill="#333" font-size="10">Date Arithmetic</text>
  <text x="232" y="252" fill="#333" font-size="10">Date Creation</text>

  <!-- Functions and Special Variables -->
  <text x="226" y="274" fill="#333" font-size="11">Functions and Special Variables:</text>
  <rect x="226" y="278" width="158" height="56"
        fill="white" stroke="#888" stroke-width="1"/>
  <rect x="372" y="279" width="11" height="54" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="1"/>
  <text x="232" y="291" fill="#333" font-size="10">$Casenum</text>
  <text x="232" y="303" fill="#333" font-size="10">$Date</text>
  <text x="232" y="315" fill="#333" font-size="10">$Date11</text>
  <text x="232" y="327" fill="#333" font-size="10">$JDate</text>

  <!-- ═══ CALCULATOR 5×6 (blue buttons) ═══ -->
  <!-- cols x=400,431,462,493,524,555  (w=27, gap=4)  -->
  <!-- rows y=150,180,210,240,270      (h=26, gap=4)  -->

  <!-- ROW 1: + < > 7 8 9 -->
  <rect x="396" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="409" y="167" fill="#111" font-size="13" text-anchor="middle">+</text>
  <rect x="427" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="440" y="167" fill="#111" font-size="11" text-anchor="middle">&lt;</text>
  <rect x="458" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="471" y="167" fill="#111" font-size="11" text-anchor="middle">&gt;</text>
  <rect x="489" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="502" y="167" fill="#111" font-size="13" text-anchor="middle">7</text>
  <rect x="520" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="533" y="167" fill="#111" font-size="13" text-anchor="middle">8</text>
  <rect x="551" y="150" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="564" y="167" fill="#111" font-size="13" text-anchor="middle">9</text>

  <!-- ROW 2: - <= >= 4 5 6 -->
  <rect x="396" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="409" y="197" fill="#111" font-size="14" text-anchor="middle">-</text>
  <rect x="427" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="440" y="197" fill="#111" font-size="10" text-anchor="middle">&lt;=</text>
  <rect x="458" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="471" y="197" fill="#111" font-size="10" text-anchor="middle">&gt;=</text>
  <rect x="489" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="502" y="197" fill="#111" font-size="13" text-anchor="middle">4</text>
  <rect x="520" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="533" y="197" fill="#111" font-size="13" text-anchor="middle">5</text>
  <rect x="551" y="180" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="564" y="197" fill="#111" font-size="13" text-anchor="middle">6</text>

  <!-- ROW 3: * = ~= 1 2 3 -->
  <rect x="396" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="409" y="227" fill="#111" font-size="13" text-anchor="middle">*</text>
  <rect x="427" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="440" y="227" fill="#111" font-size="11" text-anchor="middle">=</text>
  <rect x="458" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="471" y="227" fill="#111" font-size="10" text-anchor="middle">~=</text>
  <rect x="489" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="502" y="227" fill="#111" font-size="13" text-anchor="middle">1</text>
  <rect x="520" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="533" y="227" fill="#111" font-size="13" text-anchor="middle">2</text>
  <rect x="551" y="210" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="564" y="227" fill="#111" font-size="13" text-anchor="middle">3</text>

  <!-- ROW 4: / & | 0 . (5 buttons) -->
  <rect x="396" y="240" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="409" y="257" fill="#111" font-size="13" text-anchor="middle">/</text>
  <rect x="427" y="240" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="440" y="257" fill="#111" font-size="11" text-anchor="middle">&amp;</text>
  <rect x="458" y="240" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="471" y="257" fill="#111" font-size="13" text-anchor="middle">|</text>
  <rect x="489" y="240" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="502" y="257" fill="#111" font-size="13" text-anchor="middle">0</text>
  <rect x="520" y="240" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="533" y="257" fill="#111" font-size="13" text-anchor="middle">.</text>

  <!-- ROW 5: ** ~ () Delete[wide] ↑ -->
  <rect x="396" y="270" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="409" y="287" fill="#111" font-size="10" text-anchor="middle">**</text>
  <rect x="427" y="270" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="440" y="287" fill="#111" font-size="12" text-anchor="middle">~</text>
  <rect x="458" y="270" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="471" y="287" fill="#111" font-size="10" text-anchor="middle">( )</text>
  <!-- Delete: spans cols 4+5 -->
  <rect x="489" y="270" width="58" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="518" y="287" fill="#111" font-size="10" text-anchor="middle">Delete</text>
  <!-- ↑ -->
  <rect x="551" y="270" width="27" height="26" fill="#C8DCF5" stroke="#5588BB" stroke-width="1" rx="2"/><text x="564" y="287" fill="#111" font-size="14" text-anchor="middle">↑</text>

  <!-- ═══ If... button ═══ -->
  <rect x="28"  y="342" width="48" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="38"  y="358" fill="#333" font-size="11" font-weight="bold">If...</text>
  <rect x="82"  y="342" width="506" height="24" fill="#F4F4F4" stroke="#CCCCCC" stroke-width="1"/>
  <text x="88"  y="358" fill="#AAA" font-size="10" font-style="italic">(optional case selection condition)</text>

  <!-- Separator + Buttons -->
  <line x1="14" y1="372" x2="604" y2="372" stroke="#D0D0D0" stroke-width="1"/>

  <rect x="218" y="379" width="66" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="251"  y="395" fill="#111" font-size="11" font-weight="bold" text-anchor="middle">OK</text>

  <rect x="292" y="379" width="66" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="325"  y="395" fill="#333" font-size="11" text-anchor="middle">Paste</text>

  <rect x="366" y="379" width="66" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="399"  y="395" fill="#333" font-size="11" text-anchor="middle">Reset</text>

  <rect x="440" y="379" width="66" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="473"  y="395" fill="#333" font-size="11" text-anchor="middle">Cancel</text>

  <rect x="514" y="379" width="60" height="24" fill="#E8E8E8" stroke="#ADADAD" stroke-width="1" rx="2"/>
  <text x="544"  y="395" fill="#333" font-size="11" text-anchor="middle">Help</text>

</svg>
